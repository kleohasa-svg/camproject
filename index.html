<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18082508257"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-18082508257');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera Sigurie</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 15px;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container { width: 100%; }

@media (min-width: 900px) {
  body { display: flex; justify-content: center; }
  .container { max-width: 620px; }
  .card img { max-height: 380px; }
}

h2 { margin-bottom: 10px; }

.category {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.category button {
  flex: 1;
  padding: 10px;
  border: none;
  background: #1e293b;
  color: white;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.category button.active { background: #2563eb; }

.card {
  background: #1e293b;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #334155;
}

.card img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

@media (max-width: 600px) {
  .card img { aspect-ratio: 1 / 1; }
}

.infoRow {
  margin-top: 10px;
  padding: 0 10px;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.price { color: #22c55e; font-size: 18px; }

.nav {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.nav button {
  flex: 1;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  font-size: 13px;
  height: 40px;
  background: #334155;
}

.sendBtn {
  width: 100%;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  font-size: 14px;
  height: 45px;
  background: #2563eb;
}

.hidden { display: none; }

.whatsappBtn,
.smsBtn {
  flex: 1;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  font-size: 13px;
  height: 40px;
  background: #334155;
}

.whatsappBtn.active,
.smsBtn.active { background: #16a34a; }

.customBtn {
  margin-top: 10px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: #111;
  background: linear-gradient(135deg, #fbbf24, #f59e0b, #f97316);
}

.smallText {
  font-size: 12px;
  margin-top: 6px;
  color: #cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<h2>Zgjidh Paketën</h2>

<div class="category">
  <button onclick="setCategory('5mp')" id="btn5">SETET 5MP</button>
  <button onclick="setCategory('8mp')" id="btn8">SETET 8MP</button>
</div>

<div class="card">
  <img id="img">
  <div class="infoRow">
    <div id="title"></div>
    <div id="price" class="price"></div>
  </div>
</div>

<div class="nav">
  <button onclick="prev()">⬅️ Previous</button>
  <button onclick="next()">Next ➡️</button>
</div>

<button id="sendBtn" class="sendBtn" onclick="showSendOptions()">
  📦 Dergo Porosin
</button>

<div id="sendOptions" class="nav hidden">
  <button class="whatsappBtn" onclick="orderWhatsApp()">WhatsApp</button>
  <button class="smsBtn" onclick="orderSMS()">SMS</button>
</div>

<a href="https://www.kamerasigurie.com/personalizo.html" style="text-decoration:none;">
  <button class="customBtn">⚙️ Personalizo Oferten</button>
</a>

<div class="smallText">
  Sa kushton Sistemi i Kamerave? Llogarite tani ...
</div>

</div>

<script>
const phone = "355696669555";

const data = {
  "5mp": [
    {img:"https://i.ibb.co/FqWVxZ7L/2cop.png", name:"Set 2 Kamera 5MP", price:"€280"},
    {img:"https://i.ibb.co/1GsjZ238/3cop.png", name:"Set 3 Kamera 5MP", price:"€350"},
    {img:"https://i.ibb.co/TDg47wFf/4cop.png", name:"Set 4 Kamera 5MP", price:"€390"},
    {img:"https://i.ibb.co/S7cjnncX/5cop.png", name:"Set 5 Kamera 5MP", price:"€530"},
    {img:"https://i.ibb.co/0p8dbk13/6cop.png", name:"Set 6 Kamera 5MP", price:"€610"},
    {img:"https://i.ibb.co/v61knZ2C/7cop.png", name:"Set 7 Kamera 5MP", price:"€680"},
    {img:"https://i.ibb.co/JFQTbLk9/8cop.png", name:"Set 8 Kamera 5MP", price:"€790"}
  ],
  "8mp": [
    {img:"https://i.ibb.co/Y4gmhbjV/4K-2cam.png", name:"Set 2 Kamera 8MP", price:"€430"},
    {img:"https://i.ibb.co/tPC6GNVb/4K-3cam.png", name:"Set 3 Kamera 8MP", price:"€490"},
    {img:"https://i.ibb.co/mCddkSjv/4cop-4k.png", name:"Set 4 Kamera 8MP", price:"€550"},
    {img:"https://i.ibb.co/ZzH3RJTY/5cop-4k.png", name:"Set 5 Kamera 8MP", price:"€690"},
    {img:"https://i.ibb.co/pvTQq4qt/6cop-4k.png", name:"Set 6 Kamera 8MP", price:"€780"},
    {img:"https://i.ibb.co/d4wpcry5/7cop-4k.png", name:"Set 7 Kamera 8MP", price:"€870"},
    {img:"https://i.ibb.co/21FnnDgD/8cop-4k.png", name:"Set 8 Kamera 8MP", price:"€960"}
  ]
};

let category = "5mp";
let indexMap = { "5mp": 2, "8mp": 2 };

function render(){
  let item = data[category][indexMap[category]];
  document.getElementById("img").src = item.img;
  document.getElementById("title").innerText = item.name.replace("Set", "Seti me");
  document.getElementById("price").innerText = item.price;
}

function setCategory(cat){
  category = cat;
  document.getElementById("btn5").classList.toggle("active", cat==="5mp");
  document.getElementById("btn8").classList.toggle("active", cat==="8mp");
  render();
}

function next(){
  if(indexMap[category] < data[category].length - 1){
    indexMap[category]++;
    render();
  }
}

function prev(){
  if(indexMap[category] > 0){
    indexMap[category]--;
    render();
  }
}

function showSendOptions(){
  document.getElementById("sendBtn").style.display = "none";
  document.getElementById("sendOptions").classList.remove("hidden");

  document.querySelector(".whatsappBtn").classList.add("active");
  document.querySelector(".smsBtn").classList.add("active");

  // 🔥 REAL CONVERSION HERE
  gtag('event', 'conversion', {
    'send_to': 'AW-18082508257/ghHACLXY7Z0cEOHbtK5D'
  });
}

function buildMessage(item){
  return `Jam i interesuar per setin ne oferte:

Produkti: ${item.name.replace("Set", "Seti me")}
Cmimi: ${item.price}

Linku i fotos:
${item.img}`;
}

function orderWhatsApp(){
  let item = data[category][indexMap[category]];
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(buildMessage(item))}`, "_blank");
}

function orderSMS(){
  let item = data[category][indexMap[category]];
  window.open(`sms:+${phone}?body=${encodeURIComponent(buildMessage(item))}`);
}

setCategory("5mp");
</script>

</body>
</html>
